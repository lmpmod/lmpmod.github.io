name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # build.py бере дату останнього коміту для поля "оновлено"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Збірка сайту
        run: python3 tools/build.py
      - name: README.md має бути закомічений
        run: |
          if ! git diff --quiet -- README.md; then
            echo "::error::README.md у репозиторії застарів. Запусти 'python3 tools/build.py' локально і закоміть README.md."
            git --no-pager diff -- README.md
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
