<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lmpmod — плагіни для Lampa</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#15181d; --panel-2:#1b1f26;
    --line:#262b34; --text:#e8eaed; --muted:#8b93a1;
    --accent:#f5a623; --accent-soft:rgba(245,166,35,.12);
    --ok:#4ade80;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -200px, #1a1f27 0%, var(--bg) 60%);
    color:var(--text); min-height:100vh;
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:48px 20px 80px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  h1{
    font-size:28px;margin:0;letter-spacing:-.01em;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin:0 0 36px}
  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;
  }
  .card h2{margin:0 0 6px;font-size:18px;letter-spacing:-.01em}
  .card .desc{color:var(--muted);font-size:14px;margin:0 0 14px}
  .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:12px}
  .meta b{color:#c8cdd6;font-weight:600}
  .url{
    display:flex;align-items:center;gap:8px;
    background:#0a0c0f;border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#b9c1cd;overflow:auto;white-space:nowrap;
  }
  .row{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
  button,a.btn{
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;
    border-radius:9px;padding:9px 15px;border:1px solid transparent;
    transition:.15s ease;text-decoration:none;display:inline-block;
  }
  button.primary{background:var(--accent);color:#151005}
  button.primary:hover{filter:brightness(1.08)}
  button.ghost,a.ghost{background:transparent;border-color:var(--line);color:var(--text)}
  button.ghost:hover,a.ghost:hover{border-color:#3a424f;background:#1f242c}
  button.copied{background:var(--ok)!important;color:#04160a}
  .empty{
    border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted);
  }
  .empty b{color:var(--text);display:block;margin-bottom:6px;font-size:16px}
  section.how{margin-top:44px;border-top:1px solid var(--line);padding-top:28px}
  section.how h2{font-size:16px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  ol{margin:0;padding-left:20px;color:#cfd4dc}
  ol li{margin-bottom:8px}
  code{background:#0a0c0f;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:13px}
  footer{margin-top:44px;color:#5f6775;font-size:12.5px}
  .err{color:#fca5a5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>lmp<span>mod</span></h1>
  </header>
  <p class="sub">Плагіни для Lampa.</p>

  <main id="list" class="grid"></main>

  <section class="how">
    <h2>Як встановити</h2>
    <ol>
      <li>Відкрий Lampa → <b>Налаштування</b> → <b>Розширення</b></li>
      <li>Натисни «Додати плагін» і встав скопійоване посилання.</li>
    </ol>
  </section>

  <footer>lmpmod · плагіни для lampa</footer>
</div>

<script>
(function(){
  const list = document.getElementById('list');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function pluginUrl(p){
    const base = location.href.replace(/[^/]*$/, '');
    return base + encodeURIComponent(p.slug) + '.js';
  }

  function card(p){
    const el = document.createElement('article');
    el.className = 'card';
    const bits = [];
    if (p.version) bits.push('<span>версія <b>' + esc(p.version) + '</b></span>');
    if (p.updated) bits.push('<span>оновлено <b>' + esc(p.updated) + '</b></span>');
    if (p.author)  bits.push('<span><b>' + esc(p.author) + '</b></span>');

    el.innerHTML =
      '<h2>' + esc(p.name || p.slug) + '</h2>' +
      (p.description ? '<p class="desc">' + esc(p.description) + '</p>' : '') +
      (bits.length ? '<div class="meta">' + bits.join('') + '</div>' : '') +
      '<div class="url" data-url>' + esc(pluginUrl(p)) + '</div>' +
      '<div class="row">' +
        '<button class="primary" data-copy>Скопіювати посилання</button>' +
      '</div>';

    const url = pluginUrl(p);
    const btn = el.querySelector('[data-copy]');
    btn.addEventListener('click', async function(){
      try {
        await navigator.clipboard.writeText(url);
      } catch (e) {
        const t = document.createElement('textarea');
        t.value = url; document.body.appendChild(t); t.select();
        document.execCommand('copy'); t.remove();
      }
      const old = btn.textContent;
      btn.textContent = 'Скопійовано';
      btn.classList.add('copied');
      setTimeout(function(){ btn.textContent = old; btn.classList.remove('copied'); }, 1600);
    });
    return el;
  }

  function emptyState(){
    list.innerHTML = '<div class="empty"><b>Плагінів поки немає</b></div>';
  }

  if (location.protocol === 'file:'){
    emptyState();
    return;
  }

  fetch('plugins.json', {cache:'no-store'})
    .then(r => {
      if (r.status === 404) return {plugins: []};
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(data => {
      const items = Array.isArray(data) ? data : (data.plugins || []);
      list.innerHTML = '';
      if (!items.length){
        emptyState();
        return;
      }
      items.filter(p => p && p.slug && !p.hidden).forEach(p => list.appendChild(card(p)));
    })
    .catch(err => {
      list.innerHTML = '<div class="empty err"><b>Не вдалось прочитати plugins.json</b>' + esc(err.message) + '</div>';
    });
})();
</script>
</body>
</html>
